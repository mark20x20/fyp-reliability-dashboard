services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: fyp-reliability:latest
    container_name: fyp-app
    env_file: .env
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    volumes:
      - .:/workspace
      - pipcache:/root/.cache/pip
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stdin_open: true
    tty: true

volumes:
  pipcache:
  